name: dramaflow
description: DramaFlow AI short-drama studio client.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  sqlite3: ^3.3.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  wakelock_plus: ^1.6.1
  path: ^1.9.1
  file_selector: ^1.1.0
  archive: ^4.0.9
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - integration_test/fixtures/
