name: dramaflow
description: DramaFlow AI short-drama studio client.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  sqlite3: ^3.3.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  wakelock_plus: ^1.6.1
  path: ^1.9.1
  file_selector: ^1.1.0
  # ToonFlow 图片参考区支持从 Finder 直接拖入；仅桌面端启用，移动端仍走 file_selector。
  desktop_drop: ^0.7.1
  archive: ^4.0.9
  crypto: ^3.0.7
  image: ^4.8.0
  url_launcher: ^6.3.2
  # ToonFlow ImageTools 要求复制 PNG 到系统剪贴板；Flutter SDK 本身仅覆盖纯文本。
  clipboard: ^3.0.14
  # 视频播放 + 音频试听：media_kit 单包覆盖 macOS（主目标，内置 libmpv）/Windows/Linux/
  # iOS/Android，避开 video_player_avfoundation 在桌面端的历史缺口，且同时支持音频，
  # 无需再引入 just_audio/audioplayers。见 workbench_screen.dart / corner_scape_screen.dart。
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  file_selector_platform_interface: ^2.7.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - integration_test/fixtures/
    - assets/default_skills/toonflow_default_skills.zip
    - assets/default_prompts/toonflow_model_prompts.zip
    - assets/images/logo.jpg
    # DramaFlow 自有视觉手册包（散文件随包发布，便于在版本库里审阅与改写）。
    # Flutter 的目录声明不递归，每个子目录都要单列。
    - assets/default_skills/extra/3D_xianxia_cultivation/
    - assets/default_skills/extra/3D_xianxia_cultivation/art_prompt/
    - assets/default_skills/extra/3D_xianxia_cultivation/driector_skills/
    - assets/default_skills/extra/3D_xianxia_cultivation/images/
    - assets/default_skills/extra/2D_dark_demonic_path/
    - assets/default_skills/extra/2D_dark_demonic_path/art_prompt/
    - assets/default_skills/extra/2D_dark_demonic_path/driector_skills/
    - assets/default_skills/extra/2D_dark_demonic_path/images/
